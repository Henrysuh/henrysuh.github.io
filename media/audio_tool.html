<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 음악 자르기 & MP3 변환기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    :root {
      --bg: #0f1923;
      --panel: #162130;
      --card-bg: #1c2b3d;
      --border: #22374e;
      --accent: #4fc3a1;
      --accent2: #f0a500;
      --text: #e8edf2;
      --muted: #889fb5;
      --danger: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--accent); }

    header { text-align: center; }
    h1 { font-size: 28px; color: var(--accent); margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 14px; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .dropzone {
      border: 2px dashed var(--border);
      background: #121c28;
      border-radius: 10px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(79, 195, 161, 0.05);
    }

    .dropzone-icon { font-size: 40px; margin-bottom: 10px; }
    .dropzone-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .dropzone-desc { font-size: 13px; color: var(--muted); }

    /* Waveform Canvas */
    .waveform-container {
      position: relative;
      width: 100%;
      height: 140px;
      background: #0b1219;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    #waveformCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .playhead-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ff4757;
      pointer-events: none;
      z-index: 10;
      transform: translateX(-50%);
      display: none;
    }

    .selection-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(79, 195, 161, 0.25);
      border-left: 2px solid var(--accent);
      border-right: 2px solid var(--accent);
      pointer-events: none;
      z-index: 5;
    }

    .time-badge {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--muted);
      font-family: monospace;
    }

    /* Controls */
    .audio-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--accent);
      color: #0f1923;
      font-weight: 700;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-secondary {
      background: #253950;
      color: var(--text);
    }
    .btn-secondary:hover { background: #2f4866; }

    .btn-icon {
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 18px;
      border-radius: 50%;
    }

    .trim-box {
      background: #121c28;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .time-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .time-input-group label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .time-control-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .time-control-row input {
      flex: 1;
      background: #0d1520;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-family: monospace;
      font-weight: bold;
    }

    .mini-btn {
      background: #1c2b3d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .mini-btn:hover { background: #2a3e56; }

    .export-card {
      background: #121c28;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .export-options {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .export-options select {
      background: #0d1520;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #0d1520;
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s;
    }

    .result-box {
      background: #0d1520;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-bar">
      <a href="index.html" class="nav-link">← Media Center</a>
      <a href="../tool.html" class="nav-link">🛠️ Tool Center</a>
    </div>

    <header>
      <h1>🎵 음악 자르기 & MP3 변환기</h1>
      <p class="subtitle">FLAC, M4A, WAV, MP3 등 고음질 음원을 원하는 구간만큼 잘라내고 초고음질 MP3로 인코딩합니다.</p>
    </header>

    <div class="panel">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="dropzone-icon">🎼</div>
        <div class="dropzone-title">오디오 파일을 여기에 드래그하거나 클릭하여 선택</div>
        <div class="dropzone-desc">FLAC, M4A, AAC, WAV, MP3, OGG 등 지원 · 100% 브라우저 로컬 처리</div>
        <input type="file" id="fileInput" accept="audio/*,.flac,.m4a,.wav,.mp3,.ogg,.aac" style="display: none;" />
      </div>

      <div id="editorArea" style="display: none; flex-direction: column; gap: 18px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div id="trackTitle" style="font-weight: 700; font-size: 15px; color: var(--accent2);">📄 -</div>
          <div id="trackInfo" style="font-size: 13px; color: var(--muted);">-</div>
        </div>

        <!-- 파형 Canvas -->
        <div class="waveform-container" id="waveContainer">
          <canvas id="waveformCanvas"></canvas>
          <div class="selection-overlay" id="selectionOverlay"></div>
          <div class="playhead-line" id="playheadLine"></div>
        </div>

        <div class="time-badge">
          <span id="currentTimeDisplay">00:00.0</span>
          <span id="totalTimeDisplay">00:00.0</span>
        </div>

        <!-- 재생 컨트롤 -->
        <div class="audio-controls">
          <button class="btn btn-secondary" onclick="seekToStart()" title="선택 구간 시작으로">⏮️ 시작점</button>
          <button class="btn btn-icon" id="playBtn" onclick="togglePlay()">▶️</button>
          <button class="btn btn-secondary" onclick="seekToEnd()" title="선택 구간 끝으로">끝점 ⏭️</button>
          <button class="btn btn-secondary" id="loopBtn" onclick="toggleLoop()" style="font-size: 13px;">🔁 반복: OFF</button>
        </div>

        <!-- 구간 자르기 (Trim) 컨트롤 -->
        <div class="trim-box">
          <div class="time-input-group">
            <label>
              <span>시작 시간 (Start)</span>
              <span id="startTimeLabel" style="color: var(--accent);">00:00.0</span>
            </label>
            <div class="time-control-row">
              <input type="number" id="startInput" step="0.1" min="0" value="0" onchange="onStartInputChange()" />
              <button class="mini-btn" onclick="adjustTime('start', -1)">-1s</button>
              <button class="mini-btn" onclick="adjustTime('start', 1)">+1s</button>
              <button class="mini-btn" onclick="setStartToCurrent()">현재위치</button>
            </div>
          </div>

          <div class="time-input-group">
            <label>
              <span>종료 시간 (End)</span>
              <span id="endTimeLabel" style="color: var(--accent);">00:00.0</span>
            </label>
            <div class="time-control-row">
              <input type="number" id="endInput" step="0.1" min="0" value="0" onchange="onEndInputChange()" />
              <button class="mini-btn" onclick="adjustTime('end', -1)">-1s</button>
              <button class="mini-btn" onclick="adjustTime('end', 1)">+1s</button>
              <button class="mini-btn" onclick="setEndToCurrent()">현재위치</button>
            </div>
          </div>
        </div>

        <!-- 인코딩 및 내보내기 -->
        <div class="export-card">
          <div class="export-options">
            <label style="font-size: 13px; font-weight: 500;">출력 설정:</label>
            <select id="exportFormat">
              <option value="mp3-320">MP3 320 kbps (최고음질)</option>
              <option value="mp3-256">MP3 256 kbps (고음질)</option>
              <option value="mp3-192" selected>MP3 192 kbps (표준 권장)</option>
              <option value="mp3-128">MP3 128 kbps (경량화)</option>
              <option value="wav">WAV (무손실 원본 추출)</option>
            </select>
            <button class="btn" id="btnExport" onclick="exportSelectedAudio()" style="margin-left: auto;">⚡ 선택 구간 추출 & 변환</button>
          </div>

          <div class="progress-bar-wrap" id="progWrap">
            <div class="progress-bar-fill" id="progFill"></div>
          </div>
          <div id="progText" style="display: none; font-size: 12px; color: var(--accent); text-align: center;">인코딩 중...</div>
        </div>

        <!-- 변환 완료 결과 플레이어 -->
        <div class="result-box" id="resultBox">
          <div class="result-header">
            <span style="color: var(--accent);">✅ 변환 완료!</span>
            <span id="resultMeta" style="font-size: 12px; color: var(--muted);">-</span>
          </div>
          <audio id="resultAudioPlayer" controls></audio>
          <a class="btn" id="downloadAudioBtn" href="#" download="" style="text-align: center;">💾 MP3 다운로드</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let decodedBuffer = null;
    let originalFileName = '';
    let isPlaying = false;
    let isLooping = false;
    let startTime = 0;
    let endTime = 0;
    let duration = 0;
    let playbackStartTime = 0;
    let currentSource = null;
    let animFrameId = null;

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const editorArea = document.getElementById('editorArea');
    const canvas = document.getElementById('waveformCanvas');
    const playheadLine = document.getElementById('playheadLine');
    const selectionOverlay = document.getElementById('selectionOverlay');

    ['dragenter', 'dragover'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) loadAudioFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) loadAudioFile(e.target.files[0]);
    });

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    async function loadAudioFile(file) {
      originalFileName = file.name.replace(/\.[^/.]+$/, "");
      document.getElementById('trackTitle').textContent = `📄 ${file.name}`;
      document.getElementById('trackInfo').textContent = `파일 로딩 및 디코딩 중... (${formatSize(file.size)})`;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const ctx = getAudioContext();
          if (ctx.state === 'suspended') await ctx.resume();

          const arrayBuffer = e.target.result;
          decodedBuffer = await ctx.decodeAudioData(arrayBuffer);
          duration = decodedBuffer.duration;
          startTime = 0;
          endTime = duration;

          document.getElementById('trackInfo').textContent = `${decodedBuffer.numberOfChannels}ch · ${decodedBuffer.sampleRate}Hz · ${formatTime(duration)} (${formatSize(file.size)})`;
          document.getElementById('startInput').max = duration;
          document.getElementById('endInput').max = duration;
          document.getElementById('startInput').value = "0.0";
          document.getElementById('endInput').value = duration.toFixed(1);

          updateTimeLabels();
          editorArea.style.display = 'flex';
          drawWaveform();
          updateSelectionOverlay();
        } catch (err) {
          alert('오디오 디코딩 실패: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function drawWaveform() {
      if (!decodedBuffer) return;
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);

      const rawData = decodedBuffer.getChannelData(0);
      const step = Math.ceil(rawData.length / width);
      const amp = height / 2;

      ctx.fillStyle = '#4fc3a1';
      for (let i = 0; i < width; i++) {
        let min = 1.0;
        let max = -1.0;
        for (let j = 0; j < step; j++) {
          const datum = rawData[(i * step) + j];
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        const barHeight = Math.max(2, (max - min) * amp);
        const y = amp - (barHeight / 2);
        ctx.fillRect(i, y, 1, barHeight);
      }
    }

    window.addEventListener('resize', () => {
      if (decodedBuffer) {
        drawWaveform();
        updateSelectionOverlay();
      }
    });

    // Waveform click to seek
    document.getElementById('waveContainer').addEventListener('click', (e) => {
      if (!decodedBuffer) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      const targetTime = pct * duration;

      if (isPlaying) {
        stopAudio();
        playAudio(targetTime);
      } else {
        updatePlayhead(targetTime);
      }
    });

    function updateSelectionOverlay() {
      if (!duration) return;
      const startPct = (startTime / duration) * 100;
      const endPct = (endTime / duration) * 100;
      selectionOverlay.style.left = `${startPct}%`;
      selectionOverlay.style.width = `${endPct - startPct}%`;
    }

    function updatePlayhead(time) {
      if (!duration) return;
      const pct = (time / duration) * 100;
      playheadLine.style.left = `${pct}%`;
      playheadLine.style.display = 'block';
      document.getElementById('currentTimeDisplay').textContent = formatTime(time);
    }

    function togglePlay() {
      if (isPlaying) {
        stopAudio();
      } else {
        playAudio(startTime);
      }
    }

    function playAudio(fromTime) {
      if (!decodedBuffer) return;
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      currentSource = ctx.createBufferSource();
      currentSource.buffer = decodedBuffer;
      currentSource.connect(ctx.destination);

      const offset = fromTime;
      const playDuration = Math.max(0, endTime - offset);

      currentSource.start(0, offset, playDuration);
      isPlaying = true;
      playbackStartTime = ctx.currentTime - offset;
      document.getElementById('playBtn').textContent = '⏸️';

      currentSource.onended = () => {
        if (isPlaying) {
          if (isLooping) {
            playAudio(startTime);
          } else {
            stopAudio();
            updatePlayhead(startTime);
          }
        }
      };

      trackProgress();
    }

    function stopAudio() {
      if (currentSource) {
        try { currentSource.stop(); } catch(e) {}
        currentSource = null;
      }
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶️';
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }

    function trackProgress() {
      if (!isPlaying || !audioCtx) return;
      const curTime = audioCtx.currentTime - playbackStartTime;
      updatePlayhead(curTime);
      if (curTime >= endTime) {
        if (isLooping) {
          stopAudio();
          playAudio(startTime);
        } else {
          stopAudio();
          updatePlayhead(startTime);
        }
        return;
      }
      animFrameId = requestAnimationFrame(trackProgress);
    }

    function seekToStart() {
      stopAudio();
      updatePlayhead(startTime);
    }

    function seekToEnd() {
      stopAudio();
      updatePlayhead(endTime);
    }

    function toggleLoop() {
      isLooping = !isLooping;
      document.getElementById('loopBtn').textContent = isLooping ? '🔁 반복: ON' : '🔁 반복: OFF';
      document.getElementById('loopBtn').classList.toggle('btn-secondary', !isLooping);
    }

    function setStartToCurrent() {
      if (!audioCtx) return;
      const curTime = isPlaying ? (audioCtx.currentTime - playbackStartTime) : parseTimeToSeconds(document.getElementById('currentTimeDisplay').textContent);
      startTime = Math.max(0, Math.min(curTime, endTime - 0.1));
      document.getElementById('startInput').value = startTime.toFixed(1);
      updateTimeLabels();
      updateSelectionOverlay();
    }

    function setEndToCurrent() {
      if (!audioCtx) return;
      const curTime = isPlaying ? (audioCtx.currentTime - playbackStartTime) : parseTimeToSeconds(document.getElementById('currentTimeDisplay').textContent);
      endTime = Math.min(duration, Math.max(curTime, startTime + 0.1));
      document.getElementById('endInput').value = endTime.toFixed(1);
      updateTimeLabels();
      updateSelectionOverlay();
    }

    function onStartInputChange() {
      let val = parseFloat(document.getElementById('startInput').value) || 0;
      val = Math.max(0, Math.min(val, endTime - 0.1));
      startTime = val;
      document.getElementById('startInput').value = val.toFixed(1);
      updateTimeLabels();
      updateSelectionOverlay();
    }

    function onEndInputChange() {
      let val = parseFloat(document.getElementById('endInput').value) || duration;
      val = Math.min(duration, Math.max(val, startTime + 0.1));
      endTime = val;
      document.getElementById('endInput').value = val.toFixed(1);
      updateTimeLabels();
      updateSelectionOverlay();
    }

    function adjustTime(type, delta) {
      if (type === 'start') {
        startTime = Math.max(0, Math.min(startTime + delta, endTime - 0.1));
        document.getElementById('startInput').value = startTime.toFixed(1);
      } else {
        endTime = Math.min(duration, Math.max(endTime + delta, startTime + 0.1));
        document.getElementById('endInput').value = endTime.toFixed(1);
      }
      updateTimeLabels();
      updateSelectionOverlay();
    }

    function updateTimeLabels() {
      document.getElementById('startTimeLabel').textContent = formatTime(startTime);
      document.getElementById('endTimeLabel').textContent = formatTime(endTime);
      document.getElementById('totalTimeDisplay').textContent = formatTime(duration);
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) sec = 0;
      const mins = Math.floor(sec / 60);
      const secs = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 10);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${ms}`;
    }

    function parseTimeToSeconds(str) {
      const parts = str.split(':');
      if (parts.length === 2) {
        return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
      }
      return 0;
    }

    /* Slice AudioBuffer */
    function sliceAudioBuffer(buffer, startSec, endSec) {
      const sampleRate = buffer.sampleRate;
      const channels = buffer.numberOfChannels;
      const startOffset = Math.floor(startSec * sampleRate);
      const endOffset = Math.floor(endSec * sampleRate);
      const frameCount = endOffset - startOffset;

      const slicedBuffer = getAudioContext().createBuffer(channels, frameCount, sampleRate);
      for (let ch = 0; ch < channels; ch++) {
        const fromChannel = buffer.getChannelData(ch);
        const toChannel = slicedBuffer.getChannelData(ch);
        for (let i = 0; i < frameCount; i++) {
          toChannel[i] = fromChannel[startOffset + i];
        }
      }
      return slicedBuffer;
    }

    /* Export to MP3 or WAV */
    async function exportSelectedAudio() {
      if (!decodedBuffer) return;
      stopAudio();

      const format = document.getElementById('exportFormat').value;
      const btn = document.getElementById('btnExport');
      const progWrap = document.getElementById('progWrap');
      const progFill = document.getElementById('progFill');
      const progText = document.getElementById('progText');
      const resultBox = document.getElementById('resultBox');

      btn.disabled = true;
      progWrap.style.display = 'block';
      progText.style.display = 'block';
      progFill.style.width = '0%';
      resultBox.style.display = 'none';

      const sliced = sliceAudioBuffer(decodedBuffer, startTime, endTime);

      setTimeout(async () => {
        try {
          let outBlob = null;
          let ext = 'mp3';

          if (format.startsWith('mp3')) {
            const kbps = parseInt(format.split('-')[1], 10);
            outBlob = await encodeMp3(sliced, kbps, (pct) => {
              progFill.style.width = pct + '%';
              progText.textContent = `MP3 인코딩 중... (${pct}%)`;
            });
            ext = 'mp3';
          } else {
            outBlob = encodeWav(sliced);
            ext = 'wav';
          }

          const cutDuration = (endTime - startTime).toFixed(1);
          const outName = `${originalFileName}_cut_${startTime.toFixed(0)}s-${endTime.toFixed(0)}s.${ext}`;
          const url = URL.createObjectURL(outBlob);

          document.getElementById('resultMeta').textContent = `${formatSize(outBlob.size)} · 길이: ${cutDuration}초 (${ext.toUpperCase()})`;
          const audioPlayer = document.getElementById('resultAudioPlayer');
          audioPlayer.src = url;
          const downloadBtn = document.getElementById('downloadAudioBtn');
          downloadBtn.href = url;
          downloadBtn.download = outName;
          downloadBtn.textContent = `💾 ${outName} 다운로드`;

          resultBox.style.display = 'flex';
          progText.textContent = '완료!';
        } catch (err) {
          alert('변환 중 오류 발생: ' + err.message);
        } finally {
          btn.disabled = false;
        }
      }, 50);
    }

    function encodeMp3(buffer, kbps, progressCb) {
      return new Promise((resolve, reject) => {
        try {
          const channels = buffer.numberOfChannels;
          const sampleRate = buffer.sampleRate;
          const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
          const mp3Data = [];

          const left = buffer.getChannelData(0);
          const right = channels > 1 ? buffer.getChannelData(1) : left;

          const sampleBlockSize = 1152;
          const totalSamples = left.length;
          let offset = 0;

          function processChunk() {
            const end = Math.min(offset + sampleBlockSize * 100, totalSamples);
            for (let i = offset; i < end; i += sampleBlockSize) {
              const chunkLen = Math.min(sampleBlockSize, end - i);
              const leftChunk = new Int16Array(chunkLen);
              const rightChunk = new Int16Array(chunkLen);

              for (let j = 0; j < chunkLen; j++) {
                const l = Math.max(-1, Math.min(1, left[i + j]));
                const r = Math.max(-1, Math.min(1, right[i + j]));
                leftChunk[j] = l < 0 ? l * 0x8000 : l * 0x7FFF;
                rightChunk[j] = r < 0 ? r * 0x8000 : r * 0x7FFF;
              }

              let mp3buf = null;
              if (channels === 1) {
                mp3buf = mp3encoder.encodeBuffer(leftChunk);
              } else {
                mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
              }
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }

            offset = end;
            const pct = Math.round((offset / totalSamples) * 100);
            if (progressCb) progressCb(pct);

            if (offset < totalSamples) {
              setTimeout(processChunk, 0);
            } else {
              const mp3buf = mp3encoder.flush();
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
              resolve(new Blob(mp3Data, { type: 'audio/mp3' }));
            }
          }

          processChunk();
        } catch (e) {
          reject(e);
        }
      });
    }

    function encodeWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      const channels = [];
      let sampleRate = buffer.sampleRate;
      let offset = 0;
      let pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      // write WAVE header
      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"

      setUint32(0x20746d66); // "fmt " chunk
      setUint32(16); // 16 for PCM
      setUint16(1);  // PCM
      setUint16(numOfChan);
      setUint32(sampleRate);
      setUint32(sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);

      setUint32(0x61746164); // "data" - chunk
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out], { type: 'audio/wav' });
    }

    function formatSize(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }
  </script>
